<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador Yovoy</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tu CSS Personalizado -->
    <link rel="stylesheet" href="css/css.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Ajustes específicos de estilo para esta versión */
        body {
            /* Usa la variable de fondo de tu CSS */
            background-color: var(--yovoy-bg, #e5e5e5); 
        }
        .route-chip {
            transition: all 0.2s ease;
        }
        /* Altura obligatoria para que Leaflet dibuje el mapa */
        #map {
            height: 420px;
            width: 100%;
            border-radius: 0.75rem;
            z-index: 1;
        }
        @media (min-width: 640px) {
            #map {
                height: 500px;
            }
        }
        /* Ocultar barra de scroll en navegadores */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scroll-x-smooth {
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="min-h-screen p-4 pb-10">
    
    <div class="max-w-2xl mx-auto">
        <!-- LOGO Multicolor (Institucional) -->
        <div class="flex justify-center mb-6">
            <div class="flex items-center justify-center space-x-1 font-black text-3xl tracking-wider">
                <span style="color: #ffcc00;">Y</span>
                <span style="color: #00aeef;">O</span>
                <span style="color: #ec008c;">V</span>
                <span style="color: #00aeef;">O</span>
                <span style="color: #ffcc00;">Y</span>
                <span style="color: #ec008c;" class="text-2xl">!</span>
            </div>
        </div>

        <!-- BARRA DE RUTAS (Fondo morado institucional si prefieres) -->
        <!-- Usaremos el fondo blanco pero con el estilo de píldora -->
        <div class="yovoy-header rounded-xl p-4 mb-4">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm font-bold text-white">🚌 Selecciona una Ruta</span>
                <span id="total-rutas" class="text-xs text-white/80">Cargando...</span>
            </div>
            <div id="chips-rutas" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none scroll-x-smooth">
                <!-- Los botones se generarán con JS -->
            </div>
        </div>

        <!-- ESTADO -->
        <div id="status" class="text-sm mb-4 text-gray-600 text-center font-medium"></div>

        <!-- TARJETAS FLOTANTES (Carrusel) -->
        <div class="bg-white/80 backdrop-blur-sm rounded-xl p-3 mb-4 border border-white/50 shadow-md">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-gray-700 uppercase tracking-wide">Unidades en Ruta</span>
            </div>
            <div id="unit-carousel" class="flex gap-3 overflow-x-auto pb-2 scrollbar-none scroll-x-smooth">
                <!-- Las tarjetas se inyectarán aquí -->
            </div>
        </div>

        <!-- MAPA -->
        <div class="bg-white rounded-xl p-1 shadow-lg border border-gray-200 overflow-hidden">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
