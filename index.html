<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador Yovoy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-2xl">
        <h1 class="text-2xl font-bold mb-4">🚌 Rastreo de Unidades</h1>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="rutaInput" placeholder="Ruta (ej. 40N)" class="border p-2 rounded w-full">
            <button id="buscarBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Buscar</button>
        </div>

        <div id="status" class="text-sm mb-4 text-gray-600">Listo.</div>
        <div id="results" class="space-y-2"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
